<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="hsl(0 0% 100%)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
    <title>Imbrace Chatbot</title>
    <script>
      // Theme color updater (runs before React to avoid flash)
      (function() {
        var html = document.documentElement;
        var meta = document.querySelector('meta[name="theme-color"]');
        var LIGHT = 'hsl(0 0% 100%)';
        var DARK = 'hsl(240deg 10% 3.92%)';
        function update() {
          var isDark = html.classList.contains('dark');
          meta.setAttribute('content', isDark ? DARK : LIGHT);
        }
        // Apply saved theme immediately to avoid flash
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          html.classList.add('dark');
        }
        var observer = new MutationObserver(update);
        observer.observe(html, { attributes: true, attributeFilter: ['class'] });
        update();
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
