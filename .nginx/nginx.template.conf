worker_processes 2;

events { worker_connections 1024; }

http {
    client_max_body_size 16M;

    # Auth tokens + multi-part session JWTs + analytics cookies regularly push
    # the request header section past 32KB. Set generous buffers on both the
    # client and upstream proxy directions.
    client_header_buffer_size 64k;
    large_client_header_buffers 16 64k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      keep-alive;
    }

    server {
        listen 3000;
        include /etc/nginx/mime.types;
        root /usr/share/nginx/html;
        index index.html;

        # Values substituted at container START by generate-env-json.sh (envsubst),
        # so env vars injected at `docker run` / the ECS task definition take effect:
        #   BACKEND      - app-gateway upstream URL (e.g. https://app-gateway.example.com).
        #                  Used as a literal in proxy_pass, so nginx resolves it at
        #                  startup via the container's /etc/resolv.conf (no `resolver` needed).
        #   BACKEND_HOST - Host header sent to the gateway.

        # Client runtime config: env.json is baked into the image at build
        # time by generate-env-json.sh from .env (or .env.example).
        location /config {
            alias /usr/share/nginx/html/env.json;
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Proxy /appgateway/* -> app-gateway/* (strip /appgateway prefix).
        # Auth + platform API calls.
        location /appgateway/ {
            rewrite ^/appgateway/(.*) /$1 break;
            proxy_pass ${BACKEND};
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Proxy /ai-agent/* -> app-gateway/ai-agent/* (no rewrite; gateway
        # internally rewrites /ai-agent/* -> /api/* itself). SSE / chunked
        # streaming endpoints live here.
        location /ai-agent/ {
            proxy_pass ${BACKEND};
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Chat processing-status SSE. EventSource cannot set headers, so the
        # client hits /api/chat-status/:id directly (the only raw /api/* call
        # in the app). Rewrite into the gateway's /ai-agent/* namespace; the
        # gateway maps /ai-agent/* back to /api/* on the AI service.
        location /api/chat-status/ {
            rewrite ^/api/(.*) /ai-agent/$1 break;
            proxy_pass ${BACKEND};
            proxy_set_header Host ${BACKEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /assets {
            try_files $uri $uri/ =404;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # SPA fallback: any path -> index.html.
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
